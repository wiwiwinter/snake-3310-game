<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512" shape-rendering="crispEdges">
  <!-- Outer dark handheld bezel -->
  <rect x="0" y="0" width="16" height="16" fill="#306230"/>
  <!-- Deep green LCD border -->
  <rect x="1" y="1" width="14" height="14" fill="#0F380F"/>
  <!-- Monochrome green LCD screen -->
  <rect x="2" y="2" width="12" height="12" fill="#9BBC0F"/>
  <!-- Subtle pixel grid accents -->
  <rect x="2" y="5" width="12" height="1" fill="#8BAC0F"/>
  <rect x="2" y="9" width="12" height="1" fill="#8BAC0F"/>
  <!-- Curled retro pixel snake -->
  <rect x="3" y="10" width="6" height="2" fill="#0F380F"/>
  <rect x="7" y="6" width="2" height="4" fill="#0F380F"/>
  <rect x="4" y="6" width="3" height="2" fill="#0F380F"/>
  <!-- Snake head facing right toward food -->
  <rect x="4" y="4" width="4" height="2" fill="#0F380F"/>
  <!-- Pixel eye -->
  <rect x="6" y="4" width="1" height="1" fill="#9BBC0F"/>
  <!-- Classic 4-dot diamond food -->
  <rect x="11" y="4" width="1" height="1" fill="#0F380F"/>
  <rect x="10" y="5" width="1" height="1" fill="#0F380F"/>
  <rect x="12" y="5" width="1" height="1" fill="#0F380F"/>
  <rect x="11" y="6" width="1" height="1" fill="#0F380F"/>
</svg>
